name: Deploy

on:
  push:
    branches: [main]

# id-token: write is what lets this workflow request an OIDC token from GitHub and exchange
# it for temporary AWS credentials -- no stored AWS access key in this repo's secrets at all.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::251455325287:role/github-actions-golf-app-backend-deploy
          aws-region: us-east-1

      - name: cdk deploy
        run: npx cdk deploy --require-approval never
