name: CI

# Runs on every push to the gcp branch (and main, once gcp is merged) and on pull requests.
# No cloud credentials and no deployment: everything runs against the local Firebase emulators,
# so a push can never touch real data or cost anything. Deploys are a separate workflow.
#
# Test selection: on a branch push or pull request only the tests a change can affect run
# (functions/scripts/affected.mjs reads the import graph). A change to something shared still runs
# everything. main and the nightly schedule always run the full suite, so selection can save time
# but never hide a failure for long.
on:
  push:
    branches: [main, gcp]
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the selection step diffs against earlier commits

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator needs JDK 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Emulator jars are large; cache them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('functions/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Tests (only what the change can affect; everything on main, nightly and manual runs)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$REF" = "refs/heads/main" ]; then
            npm test
            npm run test:emulated
            npm run test:http
            npm run smoke:emulated
          elif [ "$EVENT" = "pull_request" ]; then
            npm run test:changed -- --base "$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            npm run test:changed -- --base "$BEFORE"
          fi
