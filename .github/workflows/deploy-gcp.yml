name: Deploy to Google Cloud

# Manual for now (Run workflow button). It does nothing until the repository variables below are set,
# so it cannot fail noisily on a fresh clone. Switch the trigger to `push: branches: [main]` at the
# Phase 7 cutover, in the same change that removes the AWS deploy workflow.
#
# Deploys only what changed: functions/scripts/affected.mjs compares HEAD with the `deployed-gcp`
# tag (the last commit this workflow deployed) and names the functions whose code is affected, plus
# Firestore rules and indexes if those changed. Choose scope "all" to redeploy everything, which is
# also what happens on the first run, when the tag does not exist yet. On success the tag moves.
#
# Authentication is Workload Identity Federation: GitHub proves who it is with a short-lived OIDC
# token and Google hands back short-lived credentials. No service-account key is stored anywhere.
# Setup steps and the one-time gcloud commands are in ops/DEPLOY.md.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), not secrets, since
# none of them is sensitive:
#   GCP_PROJECT_ID        golf-live-scoring-app-510200
#   WIF_PROVIDER          projects/<number>/locations/global/workloadIdentityPools/github/providers/github-actions
#   WIF_SERVICE_ACCOUNT   github-deployer@golf-live-scoring-app-510200.iam.gserviceaccount.com
#
# Not yet validated by a real run: the workflow cannot run until the variables exist.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to deploy'
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: write # moves the deployed-gcp tag after a successful deploy
  id-token: write # lets the job request the OIDC token Google exchanges for credentials

concurrency:
  group: deploy-gcp
  cancel-in-progress: false # never interrupt a deploy half way

jobs:
  deploy:
    if: ${{ vars.WIF_PROVIDER != '' && vars.WIF_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The same gates CI runs, so a deploy can never ship code that does not build or pass its
      # unit tests. (Emulator tests already ran in CI on this commit.)
      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Work out what to deploy
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          git fetch --tags --force
          BASE=0000000000000000000000000000000000000000 # unknown base = deploy everything
          if [ "$SCOPE" != "all" ] && git rev-parse -q --verify refs/tags/deployed-gcp >/dev/null; then
            BASE=$(git rev-parse deployed-gcp)
          fi
          node scripts/affected.mjs --base "$BASE" > "$RUNNER_TEMP/affected.json"
          cat "$RUNNER_TEMP/affected.json"
          TARGETS=$(node -e "
            const a = require(process.env.RUNNER_TEMP + '/affected.json');
            const t = a.functions.map((f) => 'functions:' + f);
            if (a.rules || a.all) t.push('firestore');
            console.log(t.join(','));
          ")
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${TARGETS:-nothing}" >> "$GITHUB_STEP_SUMMARY"

      - uses: google-github-actions/auth@v2
        if: steps.scope.outputs.targets != ''
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy only what changed
        if: steps.scope.outputs.targets != ''
        working-directory: .
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: npx --prefix functions firebase deploy --only "$TARGETS" --project "$PROJECT" --non-interactive

      # A short real walkthrough against the live URLs (functions/scripts/smoke.mjs): public access,
      # sign-in checks, the runtime account's permissions, the rules and the composite indexes, as
      # Google Cloud really enforces them. It creates throwaway users and data and deletes them. If
      # it fails the deploy is marked failed and the deployed-gcp tag does not move.
      - name: Smoke test the live deployment
        if: steps.scope.outputs.targets != '' && vars.FIREBASE_API_KEY != ''
        env:
          SMOKE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          SMOKE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          SMOKE_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: node scripts/smoke.mjs

      - name: Smoke test skipped
        if: steps.scope.outputs.targets != '' && vars.FIREBASE_API_KEY == ''
        run: |
          echo "::warning::Smoke test skipped, add the FIREBASE_API_KEY repository variable (the web apiKey from firebase_options.dart)."

      - name: Record what is now live
        working-directory: .
        run: |
          git tag -f deployed-gcp HEAD
          git push -f origin deployed-gcp
