name: Deploy to Google Cloud

# "Push" means deploy: a push to main runs CI (every test, on the emulators); when CI passes, this workflow deploys.
# It can also be run by hand (Run workflow button; scope "all" redeploys everything). Pull requests and other
# branches never deploy.
#
# Deploys only what changed: functions/scripts/affected.mjs compares HEAD with the `deployed-gcp` tag (the last
# commit this workflow deployed) and names the functions whose code is affected, plus Firestore rules and indexes if
# those changed. On the first run, when the tag does not exist yet, it deploys everything. After the deploy:
#   1. post-deploy.mjs grants public access to every callable and checks that anonymous callers get 401;
#   2. smoke.mjs walks the live system with throwaway users and deletes them afterwards;
#   3. only then the tag moves. A failure anywhere leaves the tag where it was, so the client deploy
#      (golf-app-client, which waits for the tag to match main) does not go out against a broken backend.
# Rollback: revert the commit on main and push; the same pipeline deploys the revert.
#
# Authentication is Workload Identity Federation: GitHub proves who it is with a short-lived OIDC token and Google
# hands back short-lived credentials. No service-account key is stored anywhere. One-time setup: ops/setup-wif.ps1.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), not secrets, none is sensitive:
#   GCP_PROJECT_ID        golf-live-scoring-app-510200
#   WIF_PROVIDER          projects/<number>/locations/global/workloadIdentityPools/github/providers/github-actions
#   WIF_SERVICE_ACCOUNT   github-deployer@golf-live-scoring-app-510200.iam.gserviceaccount.com
#   FIREBASE_API_KEY      the web apiKey from golf-app-client/lib/firebase_options.dart (public; for the smoke test)
# Until the first three exist the job is skipped, so a fresh clone cannot fail noisily.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to deploy'
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: write # moves the deployed-gcp tag after a successful deploy
  id-token: write # lets the job request the OIDC token Google exchanges for credentials

concurrency:
  group: deploy-gcp
  cancel-in-progress: false # never interrupt a deploy half way

jobs:
  deploy:
    # Only after a green CI run caused by a push to main (not the nightly schedule or a pull request), or by hand.
    if: >-
      ${{ vars.WIF_PROVIDER != '' && vars.WIF_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI tested, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The same gates CI runs, so a deploy can never ship code that does not build or pass its
      # unit tests. (The emulator and HTTP suites already ran in CI on this commit.)
      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Work out what to deploy
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          git fetch --tags --force
          BASE=0000000000000000000000000000000000000000 # unknown base = deploy everything
          if [ "$SCOPE" != "all" ] && git rev-parse -q --verify refs/tags/deployed-gcp >/dev/null; then
            BASE=$(git rev-parse deployed-gcp)
          fi
          node scripts/affected.mjs --base "$BASE" > "$RUNNER_TEMP/affected.json"
          cat "$RUNNER_TEMP/affected.json"
          TARGETS=$(node -e "
            const a = require(process.env.RUNNER_TEMP + '/affected.json');
            const t = a.functions.map((f) => 'functions:' + f);
            if (a.rules || a.all) t.push('firestore');
            console.log(t.join(','));
          ")
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${TARGETS:-nothing}" >> "$GITHUB_STEP_SUMMARY"

      - uses: google-github-actions/auth@v2
        if: steps.scope.outputs.targets != ''
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.scope.outputs.targets != ''

      - name: Deploy only what changed
        if: steps.scope.outputs.targets != ''
        working-directory: .
        env:
          TARGETS: ${{ steps.scope.outputs.targets }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: npx --prefix functions firebase deploy --only "$TARGETS" --project "$PROJECT" --non-interactive

      # Public access for every callable (the deploy does not set it) and an anonymous 401 probe of each.
      - name: Grant public access and probe every callable
        if: steps.scope.outputs.targets != ''
        env:
          POST_DEPLOY_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: node scripts/post-deploy.mjs

      # A short real walkthrough against the live URLs (functions/scripts/smoke.mjs): sign-in checks, the runtime
      # account's permissions, the rules and the composite indexes, as Google Cloud really enforces them. It creates
      # throwaway users and data and deletes them. If it fails the run fails and the deployed-gcp tag does not move.
      - name: Smoke test the live deployment
        if: steps.scope.outputs.targets != '' && vars.FIREBASE_API_KEY != ''
        env:
          SMOKE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          SMOKE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          SMOKE_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: node scripts/smoke.mjs

      - name: Smoke test skipped
        if: steps.scope.outputs.targets != '' && vars.FIREBASE_API_KEY == ''
        run: |
          echo "::warning::Smoke test skipped, add the FIREBASE_API_KEY repository variable (the web apiKey from firebase_options.dart)."

      - name: Record what is now live
        working-directory: .
        run: |
          git tag -f deployed-gcp HEAD
          git push -f origin deployed-gcp
